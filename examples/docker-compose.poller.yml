# The ICMP poller as a service next to NetBox (in netbox-docker: docker-compose.override.yml, under "services:").
#
# Step 1 - create the user, token and environment file (run in the netbox-docker folder):
#
#   docker compose exec netbox /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py dependencies_setup_poller \
#       --name netbox-poller --netbox-url http://netbox:8080 --write /tmp/dependencies-poller.env
#   docker compose cp netbox:/tmp/dependencies-poller.env ./dependencies-poller.env
#   docker compose exec netbox rm /tmp/dependencies-poller.env
#
#   --netbox-url is the address of NetBox as seen from the poller container. The file holds the API token:
#   keep it private and out of git.
#
# Step 2 - add the service below to your compose file (use the same version as the plugin).
# Step 3 - start it and check:
#
#   docker compose up -d --build dependencies-poller      # the first start builds the image (about a minute)
#   docker compose logs -f dependencies-poller        # after a round: "polled N devices"
#
# Then open Dependencies -> Configuration -> ICMP poller in NetBox: the poller shows as "reporting".
# Everything else (interval, packets, timeout, scope, ...) is managed there, no restart needed.
services:
  dependencies-poller:
    # built from the source of the release - no registry needed (if "failed to execute bake": COMPOSE_BAKE=false)
    build: https://github.com/Kinet-s-r-o/netbox-dependencies.git#v1.17.1:poller
    image: netbox-dependencies-poller:1.17.1
    # or the prebuilt image, once the package is public:  image: ghcr.io/kinet-s-r-o/netbox-dependencies-poller:1.17.1
    restart: unless-stopped
    env_file: dependencies-poller.env   # NETBOX_URL, NETBOX_TOKEN, POLLER_NAME
    cap_drop: [ALL]
    cap_add: [NET_RAW]                  # raw ICMP sockets, nothing else
    read_only: true
    security_opt: ["no-new-privileges:true"]
