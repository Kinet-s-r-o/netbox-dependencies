# The ICMP poller as a service next to NetBox (for example in netbox-docker's docker-compose.override.yml).
#
# 1. Create the user, token and env file:   manage.py dependencies_setup_poller --write dependencies-poller.env
#    (in netbox-docker: docker compose exec netbox python /opt/netbox/netbox/manage.py dependencies_setup_poller ...
#     and copy the printed env file; the command prints this service for the installed plugin version too)
# 2. Add the service below and start it:    docker compose up -d dependencies-poller
services:
  dependencies-poller:
    image: ghcr.io/adrian-13/netbox-dependencies-poller:1.10.0
    restart: unless-stopped
    env_file: dependencies-poller.env   # NETBOX_URL, NETBOX_TOKEN, POLLER_NAME - keep it out of git
    cap_drop: [ALL]
    cap_add: [NET_RAW]                  # raw ICMP sockets, nothing else
    read_only: true
    security_opt: ["no-new-privileges:true"]
    # Everything else (interval, packets, timeout, scope, ...) is managed in NetBox:
    # Dependencies -> Configuration -> ICMP poller.
